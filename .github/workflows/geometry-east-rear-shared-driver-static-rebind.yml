name: Geometry east rear shared-driver static rebind

on:
  pull_request:
    paths:
      - "src/axm_nature_design/rear_tree_geometry_shared_driver_static_rebind.py"
      - "tests/test_rear_tree_geometry_shared_driver_static_rebind.py"
      - "tools/verify_rear_tree_geometry_shared_driver_static_rebind.py"
      - "contracts/east-rear-shared-driver-static-geometry-rebind-002.json"
      - "docs/GEOMETRY_EAST_REAR_SHARED_DRIVER_STATIC_REBIND_002.md"
      - ".github/workflows/geometry-east-rear-shared-driver-static-rebind.yml"
      - ".github/workflows/geometry-east-rear-simultaneous-socket-audit.yml"
      - "src/axm_nature_design/rear_tree_geometry_shared_driver_continuous_clearance.py"
      - "tests/test_rear_tree_geometry_shared_driver_continuous_clearance.py"
      - "tools/verify_rear_tree_geometry_shared_driver_continuous_clearance.py"
      - "contracts/east-rear-shared-driver-continuous-clearance-003.json"
      - "docs/GEOMETRY_EAST_REAR_SHARED_DRIVER_CONTINUOUS_CLEARANCE_003.md"
      - ".github/workflows/geometry-east-rear-shared-driver-continuous-clearance.yml"
      - "src/axm_nature_design/rear_tree_geometry_upper_trunk_east_mid_hierarchy.py"
      - "tests/test_rear_tree_geometry_upper_trunk_east_mid_hierarchy.py"
      - "tools/verify_rear_tree_geometry_upper_trunk_east_mid_hierarchy.py"
      - "contracts/east-rear-upper-trunk-east-mid-geometry-rebind-004.json"
      - "docs/GEOMETRY_EAST_REAR_UPPER_TRUNK_EAST_MID_HIERARCHY_REBIND_004.md"
      - ".github/workflows/geometry-east-rear-upper-trunk-east-mid-hierarchy-rebind.yml"
      - "src/axm_nature_design/rear_tree_rigging_north_low_parent_influence_gate.py"
      - "tests/test_rear_tree_rigging_north_low_parent_influence_gate.py"
      - "tools/verify_rear_tree_rigging_north_low_parent_influence_gate.py"
      - "contracts/east-rear-north-low-upper-trunk-parent-influence-gate-rigging-007.json"
      - "docs/RIGGING_EAST_REAR_NORTH_LOW_PARENT_INFLUENCE_GATE_007.md"
      - ".github/workflows/rigging-east-rear-north-low-parent-influence-gate.yml"
      - "src/axm_nature_design/rear_tree_geometry_north_low_attachment_topology.py"
      - "tests/test_rear_tree_geometry_north_low_attachment_topology.py"
      - "tools/verify_rear_tree_geometry_north_low_attachment_topology.py"
      - "contracts/east-rear-north-low-attachment-topology-geometry-005.json"
      - "docs/GEOMETRY_EAST_REAR_NORTH_LOW_ATTACHMENT_TOPOLOGY_005.md"
      - ".github/workflows/geometry-east-rear-north-low-attachment-topology.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact Geometry branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Preserve prior Geometry head and bind current Rigging base
        shell: bash
        run: |
          set -euo pipefail
          prior=76c89348d63fd3523f81287767fc37527d6a8fcb
          current_rigging=b4b480b415047fea90b4740f7702ced0dba9142d
          hierarchy_rigging=6cf64925f0ea00737e4d3f2d4f15979c773f309d
          git merge-base --is-ancestor "$prior" HEAD
          git merge-base --is-ancestor "$current_rigging" HEAD
          git merge-base --is-ancestor "$hierarchy_rigging" HEAD
          cat > /tmp/expected-geometry-files <<'EOF'
          .github/workflows/geometry-east-rear-north-low-attachment-topology.yml
          .github/workflows/geometry-east-rear-shared-driver-continuous-clearance.yml
          .github/workflows/geometry-east-rear-shared-driver-static-rebind.yml
          .github/workflows/geometry-east-rear-simultaneous-socket-audit.yml
          .github/workflows/geometry-east-rear-upper-trunk-east-mid-hierarchy-rebind.yml
          .github/workflows/rigging-east-rear-north-low-parent-influence-gate.yml
          .github/workflows/rigging-east-rear-upper-trunk-east-mid-hierarchy.yml
          contracts/east-rear-north-low-attachment-topology-geometry-005.json
          contracts/east-rear-north-low-upper-trunk-parent-influence-gate-rigging-007.json
          contracts/east-rear-shared-driver-continuous-clearance-003.json
          contracts/east-rear-shared-driver-static-geometry-rebind-002.json
          contracts/east-rear-simultaneous-primary-branch-geometry-audit-001.json
          contracts/east-rear-upper-trunk-east-mid-geometry-rebind-004.json
          contracts/east-rear-upper-trunk-east-mid-hierarchy-rigging-006.json
          docs/GEOMETRY_EAST_REAR_NORTH_LOW_ATTACHMENT_TOPOLOGY_005.md
          docs/GEOMETRY_EAST_REAR_SHARED_DRIVER_CONTINUOUS_CLEARANCE_003.md
          docs/GEOMETRY_EAST_REAR_SHARED_DRIVER_STATIC_REBIND_002.md
          docs/GEOMETRY_EAST_REAR_SIMULTANEOUS_PRIMARY_BRANCH_AUDIT_001.md
          docs/GEOMETRY_EAST_REAR_UPPER_TRUNK_EAST_MID_HIERARCHY_REBIND_004.md
          docs/RIGGING_EAST_REAR_NORTH_LOW_PARENT_INFLUENCE_GATE_007.md
          docs/RIGGING_EAST_REAR_UPPER_TRUNK_EAST_MID_HIERARCHY_006.md
          src/axm_nature_design/rear_tree_geometry_north_low_attachment_topology.py
          src/axm_nature_design/rear_tree_geometry_shared_driver_continuous_clearance.py
          src/axm_nature_design/rear_tree_geometry_shared_driver_static_rebind.py
          src/axm_nature_design/rear_tree_geometry_simultaneous_socket_audit.py
          src/axm_nature_design/rear_tree_geometry_upper_trunk_east_mid_hierarchy.py
          src/axm_nature_design/rear_tree_rigging_north_low_parent_influence_gate.py
          src/axm_nature_design/rear_tree_rigging_upper_trunk_east_mid_hierarchy.py
          tests/test_rear_tree_geometry_north_low_attachment_topology.py
          tests/test_rear_tree_geometry_shared_driver_continuous_clearance.py
          tests/test_rear_tree_geometry_shared_driver_static_rebind.py
          tests/test_rear_tree_geometry_simultaneous_socket_audit.py
          tests/test_rear_tree_geometry_upper_trunk_east_mid_hierarchy.py
          tests/test_rear_tree_rigging_north_low_parent_influence_gate.py
          tests/test_rear_tree_rigging_upper_trunk_east_mid_hierarchy.py
          tools/verify_rear_tree_geometry_north_low_attachment_topology.py
          tools/verify_rear_tree_geometry_shared_driver_continuous_clearance.py
          tools/verify_rear_tree_geometry_shared_driver_static_rebind.py
          tools/verify_rear_tree_geometry_simultaneous_socket_audit.py
          tools/verify_rear_tree_geometry_upper_trunk_east_mid_hierarchy.py
          tools/verify_rear_tree_rigging_north_low_parent_influence_gate.py
          tools/verify_rear_tree_rigging_upper_trunk_east_mid_hierarchy.py
          EOF
          git diff --name-only "$current_rigging"...HEAD | sort > /tmp/actual-geometry-files
          diff -u /tmp/expected-geometry-files /tmp/actual-geometry-files
          test "$(git rev-parse "$prior":src/axm_nature_design/rear_tree_geometry_simultaneous_socket_audit.py)" = \
               "$(git rev-parse HEAD:src/axm_nature_design/rear_tree_geometry_simultaneous_socket_audit.py)"
          test "$(git rev-parse "$prior":tools/verify_rear_tree_geometry_simultaneous_socket_audit.py)" = \
               "$(git rev-parse HEAD:tools/verify_rear_tree_geometry_simultaneous_socket_audit.py)"

      - name: Checkout exact Rigging shared-driver donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: 754797a815266a643c6b08f1606eb76ba95dd8c6
          path: _rigging
          fetch-depth: 1

      - name: Checkout exact VFX static-response donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: ba1c12dd527f1ecc6a0eb4bc0b4322f15ccad475
          path: _vfx
          fetch-depth: 1

      - name: Checkout exact merged UC observer
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: ce70d717e381df6ca8a27c0c9fabe9d48bb1b23c
          path: _uc
          fetch-depth: 1

      - name: Bind exact donor commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _rigging rev-parse HEAD)" = "754797a815266a643c6b08f1606eb76ba95dd8c6"
          test "$(git -C _vfx rev-parse HEAD)" = "ba1c12dd527f1ecc6a0eb4bc0b4322f15ccad475"
          test "$(git -C _uc rev-parse HEAD)" = "ce70d717e381df6ca8a27c0c9fabe9d48bb1b23c"
          test -f _rigging/contracts/east-rear-primary-branch-shared-driver-polarity-rigging-004.json
          test -f _vfx/contracts/east-rear-shared-driver-vfx-response-envelope-003.json
          test -f _uc/src/axm_uc/mesh_self_intersection.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m compileall -q src tools tests

      - name: Full repository unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build exact shared-driver Geometry evidence
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/exact-geometry-head.txt
          printf '%s\n' '76c89348d63fd3523f81287767fc37527d6a8fcb' > evidence/prior-geometry-head.txt
          printf '%s\n' '754797a815266a643c6b08f1606eb76ba95dd8c6' > evidence/exact-rigging-donor-head.txt
          printf '%s\n' 'ba1c12dd527f1ecc6a0eb4bc0b4322f15ccad475' > evidence/exact-vfx-donor-head.txt
          printf '%s\n' 'ce70d717e381df6ca8a27c0c9fabe9d48bb1b23c' > evidence/exact-uc-head.txt
          python tools/verify_rear_tree_geometry_shared_driver_static_rebind.py \
            --uc-root _uc \
            --rigging-root _rigging \
            --vfx-root _vfx \
            --output evidence/east-rear-shared-driver-static-geometry-rebind-002.json \
            | tee evidence/verifier.log
          cp contracts/east-rear-shared-driver-static-geometry-rebind-002.json \
            evidence/east-rear-shared-driver-static-geometry-contract-002.json
          cp docs/GEOMETRY_EAST_REAR_SHARED_DRIVER_STATIC_REBIND_002.md evidence/
          cp _rigging/contracts/east-rear-primary-branch-shared-driver-polarity-rigging-004.json \
            evidence/exact-rigging-shared-driver-contract.json
          cp _vfx/contracts/east-rear-shared-driver-vfx-response-envelope-003.json \
            evidence/exact-vfx-static-response-contract.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('evidence/east-rear-shared-driver-static-geometry-rebind-002.json').read_text())
          assert p['result'] == 'PASS_SHARED_DRIVER_STATIC_WITNESS_STRUCTURE_REBOUND', p
          assert p['shared_driver']['values_deg'] == [-5.0, -2.5, 0.0, 2.5, 5.0], p
          assert p['shared_driver']['state_count'] == 5, p
          assert p['shared_driver']['prior_geometry_overlap_state_count'] == 3, p
          assert p['shared_driver']['new_interior_state_count'] == 2, p
          assert p['shared_driver']['maximum_composition_order_vertex_delta_m'] == 0.0, p
          assert p['shared_driver']['maximum_globally_fixed_vertex_drift_m'] == 0.0, p
          assert p['shared_driver']['maximum_pivot_vertex_drift_m'] == 0.0, p
          assert p['uc_observer']['result'] == 'PASS_FIVE_SHARED_DRIVER_STATIC_WITNESSES_NO_CROSS_BRANCH_NONADJACENT_TRIANGLE_INTERSECTION', p
          assert p['uc_observer']['branch_pair_count'] == 10, p
          assert p['uc_observer']['state_count'] == 5, p
          assert p['uc_observer']['branch_pair_state_observations'] == 50, p
          assert p['uc_observer']['maximum_cross_branch_intersection_pair_count_in_any_pair_state'] == 0, p
          assert p['uc_observer']['budget_hold_control']['inspection_complete'] is False, p
          assert p['uc_observer']['budget_hold_control']['triangle_pair_checks_performed'] == 0, p
          assert p['all_failure_controls_rejected'] is True, p
          assert p['truth_boundary']['continuous_interval_checked'] is False, p
          assert p['truth_boundary']['simultaneous_motion_claimed'] is False, p
          assert p['truth_boundary']['child_fixed_receiver_clearance_checked'] is False, p
          print(json.dumps({
              'result': p['result'],
              'observer_result': p['uc_observer']['result'],
              'new_interior_states': p['shared_driver']['new_interior_state_count'],
              'observations': p['uc_observer']['branch_pair_state_observations'],
              'max_cross': p['uc_observer']['maximum_cross_branch_intersection_pair_count_in_any_pair_state'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload retained Geometry evidence
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: nature-east-rear-shared-driver-static-geometry-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
