name: Nature VFX dynamic leaf backface Godot evidence

on:
  push:
    branches: [studio/vfx-sapling-wind-response-migrated-001]
    paths:
      - "src/axm_nature_design/wind_response.py"
      - "src/axm_nature_design/wind_response_migrated.py"
      - "examples/sapling_wind_response_migrated_001.json"
      - "tools/build_sapling_wind_leaf_backface_dynamic.py"
      - "target-proof-vfx/observe_leaf_backface_wind_response.gd"
      - "target-proof-vfx/project.godot"
      - ".github/workflows/vfx-wind-leaf-backface-dynamic.yml"
  pull_request:
    paths:
      - "src/axm_nature_design/wind_response.py"
      - "src/axm_nature_design/wind_response_migrated.py"
      - "examples/sapling_wind_response_migrated_001.json"
      - "tools/build_sapling_wind_leaf_backface_dynamic.py"
      - "target-proof-vfx/observe_leaf_backface_wind_response.gd"
      - "target-proof-vfx/project.godot"
      - ".github/workflows/vfx-wind-leaf-backface-dynamic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-leaf-backface-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact VFX PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact VFX head
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          OBSERVED="$(git rev-parse HEAD)"
          test "$OBSERVED" = "$EXPECTED"
          printf '%s\n' "$OBSERVED" > exact-head.txt
          git merge-base --is-ancestor 4ddbe66e5c02d22407ef773d5346a2fe6f349a2d HEAD

      - name: Checkout exact Geometry leaf donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: da3adbef4de8cddb8f3ebe841d39bb31a8936f5f
          path: geometry-leaf-donor
          fetch-depth: 1

      - name: Verify exact Geometry leaf donor
        run: |
          set -euo pipefail
          OBSERVED="$(git -C geometry-leaf-donor rev-parse HEAD)"
          test "$OBSERVED" = "da3adbef4de8cddb8f3ebe841d39bb31a8936f5f"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild exact Geometry donor and dynamic VFX composition
        run: |
          set -euo pipefail
          python -m compileall -q src tools tests
          python -m unittest discover -s tests -v
          rm -rf geometry-leaf-evidence evidence/sapling-wind-leaf-backface-dynamic-001
          python geometry-leaf-donor/tools/build_leaf_backface_candidate_evidence.py geometry-leaf-evidence
          git -C geometry-leaf-donor rev-parse HEAD > geometry-leaf-evidence/exact-head.txt
          python tools/build_sapling_wind_leaf_backface_dynamic.py \
            geometry-leaf-evidence \
            evidence/sapling-wind-leaf-backface-dynamic-001
          cp exact-head.txt evidence/sapling-wind-leaf-backface-dynamic-001/exact-head.txt
          cp geometry-leaf-evidence/exact-head.txt evidence/sapling-wind-leaf-backface-dynamic-001/geometry-leaf-head.txt
          cp geometry-leaf-evidence/summary.json evidence/sapling-wind-leaf-backface-dynamic-001/geometry-leaf-summary.json
          cp geometry-leaf-evidence/sapling-neutral-001-report.json evidence/sapling-wind-leaf-backface-dynamic-001/geometry-leaf-sapling-report.json
          rm -rf target-proof-vfx/generated-leaf
          mkdir -p target-proof-vfx/generated-leaf
          cp evidence/sapling-wind-leaf-backface-dynamic-001/leaf-dynamic-summary.json target-proof-vfx/generated-leaf/
          cp evidence/sapling-wind-leaf-backface-dynamic-001/frame_*_mesh.json target-proof-vfx/generated-leaf/
          cp exact-head.txt target-proof-vfx/generated-leaf/

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Observe dynamic explicit leaf backfaces under real Godot culling
        run: |
          set -euo pipefail
          rm -f target-proof-vfx/vfx-leaf-backface-wind-godot-receipt.json target-proof-vfx/leaf-*.png
          xvfb-run --auto-servernum --server-args="-screen 0 1000x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path target-proof-vfx \
            --script observe_leaf_backface_wind_response.gd \
            2>&1 | tee evidence/sapling-wind-leaf-backface-dynamic-001/godot-target-host.log
          cp target-proof-vfx/vfx-leaf-backface-wind-godot-receipt.json evidence/sapling-wind-leaf-backface-dynamic-001/
          cp target-proof-vfx/leaf-*.png evidence/sapling-wind-leaf-backface-dynamic-001/

      - name: Validate bounded dynamic leaf-backface target-host result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('evidence/sapling-wind-leaf-backface-dynamic-001')
          r = json.loads((root/'vfx-leaf-backface-wind-godot-receipt.json').read_text())
          head = (root/'exact-head.txt').read_text().strip()
          assert r['state'] == 'PASS_DYNAMIC_EXPLICIT_LEAF_BACKFACE_GODOT_CULLING_RECOVERY', r
          assert r['vfx_head'] == head, (r['vfx_head'], head)
          assert r['geometry_leaf_head'] == 'da3adbef4de8cddb8f3ebe841d39bb31a8936f5f', r
          assert r['geometry_leaf_candidate_digest'] == 'e0b423bd4ff20251a960655441f97e36277da2f5b88a832ecfc5ccfe404bbbea', r
          assert r['migrated_neutral_mesh_digest'] == '47dd4d82651138299d05071df3e8a410f21f673ab8d42b936d7222eb5351b862', r
          assert r['sample_ids'] == ['0000','0125','0250','0375','0500'], r
          assert set(r['contexts']) == {'ground_oblique','crown_overhead'}, r
          assert len(r['captures']) == 40, len(r['captures'])
          assert len(r['no_cull_front_vs_candidate']) == 10, r
          assert all(v['changed_pixels'] == 0 for v in r['no_cull_front_vs_candidate'].values()), r
          assert all(v['changed_pixels'] == 0 for v in r['candidate_culling_stability'].values()), r
          assert all(v['changed_pixels'] == 0 for v in r['candidate_back_equals_front_no_cull'].values()), r
          assert r['total_baseline_culling_loss_changed_pixels'] > 0, r
          assert r['single_sided_baseline_culling_loss']['crown_overhead/0000']['changed_pixels'] > 0, r
          assert all(v['changed_pixels'] == 0 for v in r['neutral_return'].values()), r
          assert all(v['changed_pixels'] > 0 for v in r['neutral_to_peak_visual_delta'].values()), r
          assert all(v['changed_pixels'] == 0 for v in r['mirrored_phase_visual_identity'].values()), r
          truth = r['truth_boundary']
          assert truth['exact_geometry_leaf_candidate_consumed'] is True, truth
          assert truth['real_godot_backface_culling_tested'] is True, truth
          assert truth['renderer_visible_leaf_backface_recovery_observed'] is True, truth
          assert truth['shaded_leaf_material_or_translucency_tested'] is False, truth
          assert truth['continuous_playback_or_wall_clock_timing_tested'] is False, truth
          assert truth['physical_wind_or_biomechanics'] is False, truth
          assert truth['gameplay_or_collision'] is False, truth
          assert truth['runtime_cost_or_target_device_performance'] is False, truth
          print(json.dumps({
              'state': r['state'],
              'total_baseline_culling_loss_changed_pixels': r['total_baseline_culling_loss_changed_pixels'],
              'neutral_to_peak_visual_delta': r['neutral_to_peak_visual_delta'],
          }, indent=2))
          PY

      - name: Retain exact dynamic leaf-backface VFX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapling-wind-leaf-backface-dynamic-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/sapling-wind-leaf-backface-dynamic-001
          if-no-files-found: warn
          retention-days: 30
