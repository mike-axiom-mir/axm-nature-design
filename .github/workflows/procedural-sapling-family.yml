name: Procedural sapling variation family
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout exact procedural head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout exact Nature source-generator migration
        if: matrix.python == '3.11'
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: 4ddbe66e5c02d22407ef773d5346a2fe6f349a2d
          path: .studio-deps/migrated-nature
      - name: Checkout exact Geometry leaf-backface provider
        if: matrix.python == '3.11'
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: da3adbef4de8cddb8f3ebe841d39bb31a8936f5f
          path: .studio-deps/geometry-leaf-backface
      - name: Checkout exact VFX leaf-flutter provider
        if: matrix.python == '3.11'
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: 9d446359defe1e663d4d9cc683ca0b9cac6bf6c0
          path: .studio-deps/vfx-leaf-flutter
      - name: Checkout exact Map leaf-flutter receiver
        if: matrix.python == '3.11'
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          ref: 7713cbe5863c3bc38dabb6236eb4b393401224b6
          path: .studio-deps/map-leaf-flutter-receiver
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Test full receiving repository
        run: python -m unittest discover -s tests -v
      - name: Build exact retained procedural evidence
        if: matrix.python == '3.11'
        run: python tools/build_sapling_variation_evidence.py evidence/sapling-variation-family-001
      - name: Rebind nine branch-crown variants to migrated source lineage
        if: matrix.python == '3.11'
        run: >-
          python tools/build_migrated_branch_crown_lineage_evidence.py
          evidence/tree-branch-crown-migrated-lineage-001
          --migrated-root .studio-deps/migrated-nature
      - name: Verify migrated lineage summary
        if: matrix.python == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('evidence/tree-branch-crown-migrated-lineage-001/summary.json')
          data = json.loads(p.read_text())
          assert data['state'] == 'PASS_BRANCH_CROWN_VARIANTS_REBOUND_TO_MIGRATED_SOURCE_LINEAGE'
          assert data['source_case_count'] == 3
          assert data['retained_output_count'] == 9
          assert data['globally_distinct_source_outputs'] == 9
          assert data['globally_distinct_migrated_mesh_outputs'] == 9
          assert data['all_variant_source_identities_preserved'] is True
          assert data['all_mesh_identities_migrated'] is True
          assert data['all_shared_edge_orientation_conflicts_zero'] is True
          assert data['all_failure_bounds_hold'] is True
          PY
      - name: Derive exact Geometry leaf-backface candidate across all nine procedural outputs
        if: matrix.python == '3.11'
        run: >-
          python tools/build_procedural_leaf_backface_family_evidence.py
          evidence/tree-procedural-leaf-backface-family-001
          --geometry-root .studio-deps/geometry-leaf-backface
      - name: Verify procedural leaf-backface family summary
        if: matrix.python == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('evidence/tree-procedural-leaf-backface-family-001/summary.json')
          data = json.loads(p.read_text())
          assert data['state'] == 'PASS_PROCEDURAL_VARIANTS_EXPLICIT_LEAF_BACKFACE_DERIVATION'
          assert data['source_case_count'] == 3
          assert data['retained_output_count'] == 9
          assert data['distinct_variant_source_digests'] == 9
          assert data['distinct_baseline_mesh_digests'] == 9
          assert data['distinct_candidate_mesh_digests'] == 9
          assert data['all_outputs_materially_distinct'] is True
          assert data['all_candidate_checks_pass'] is True
          assert data['all_failure_bounds_hold'] is True
          assert data['decision'] == 'PASS_DERIVED_REVIEW_FAMILY_ONLY__NO_SOURCE_OR_RECEIVER_ADOPTION'
          PY
      - name: Exercise exact VFX leaf flutter across all nine procedural outputs
        if: matrix.python == '3.11'
        run: >-
          python tools/build_procedural_leaf_flutter_family_evidence.py
          evidence/tree-procedural-leaf-flutter-family-001
          --vfx-root .studio-deps/vfx-leaf-flutter
      - name: Verify procedural leaf-flutter family summary
        if: matrix.python == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('evidence/tree-procedural-leaf-flutter-family-001/summary.json')
          data = json.loads(p.read_text())
          assert data['state'] == 'PASS_PROCEDURAL_VARIANTS_VFX_LEAF_FLUTTER_COMPATIBILITY'
          assert data['source_case_count'] == 3
          assert data['retained_output_count'] == 9
          assert data['tested_phase_count_per_output'] == 5
          assert data['tested_mesh_states_total'] == 45
          assert data['tested_interior_mesh_states_total'] == 27
          assert data['distinct_variant_source_digests'] == 9
          assert data['distinct_baseline_mesh_digests'] == 9
          assert data['distinct_midpoint_flutter_digests'] == 9
          assert data['distinct_interior_flutter_digests'] == 27
          assert data['all_midpoint_outputs_materially_distinct'] is True
          assert data['all_interior_outputs_materially_distinct'] is True
          assert data['all_candidate_checks_pass'] is True
          assert data['all_deterministic_replays_exact'] is True
          assert data['all_malformed_leaf_controls_rejected'] is True
          assert data['zero_duration_control_rejected'] is True
          assert data['decision'] == 'PASS_DERIVED_VFX_COMPATIBILITY_FAMILY_ONLY__NO_SOURCE_OR_RECEIVER_ADOPTION'
          PY
      - name: Exercise exact Map leaf-flutter receiver contract across all nine procedural outputs
        if: matrix.python == '3.11'
        run: >-
          python tools/build_procedural_leaf_flutter_map_receiver_family_evidence.py
          evidence/tree-procedural-leaf-flutter-map-receiver-family-001
          --vfx-root .studio-deps/vfx-leaf-flutter
          --map-root .studio-deps/map-leaf-flutter-receiver
      - name: Verify procedural Map receiver compatibility summary
        if: matrix.python == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('evidence/tree-procedural-leaf-flutter-map-receiver-family-001/summary.json')
          data = json.loads(p.read_text())
          assert data['state'] == 'PASS_PROCEDURAL_VARIANTS_CURRENT_WORLD_LEAF_FLUTTER_RECEIVER_COMPATIBILITY'
          assert data['map_receiver']['head'] == '7713cbe5863c3bc38dabb6236eb4b393401224b6'
          assert data['map_receiver']['git_blob'] == '128f4881760b01a687ac13e56676822fd1dd7b10'
          assert data['source_case_count'] == 3
          assert data['retained_output_count'] == 9
          assert data['receiver_states_per_output'] == 17
          assert data['tested_receiver_states_total'] == 153
          assert data['tested_interior_receiver_states_total'] == 135
          assert data['distinct_variant_source_digests'] == 9
          assert data['distinct_baseline_receiver_digests'] == 9
          assert data['distinct_midpoint_receiver_digests'] == 9
          assert data['materially_different_receiver_translation_contexts'] == 3
          assert data['all_outputs_materially_distinct'] is True
          assert data['all_candidate_checks_pass'] is True
          assert data['all_failure_controls_rejected'] is True
          for output in data['outputs']:
              controls = {row['label']: row for row in output['failure_controls']}
              assert controls['foliage-partition-count-drift']['rejected'] is True
              assert controls['non-translation-receiver-drift']['exception'] == 'ValueError'
              assert controls['non-translation-receiver-drift']['message'] == 'non-translation receiver drift rejected'
              assert controls['flutter-domain-escape']['rejected'] is True
          assert data['decision'] == 'PASS_RECEIVER_COMPATIBILITY_FAMILY_ONLY__NO_MAP_SOURCE_OR_ART_ADOPTION'
          PY
      - name: Upload exact retained procedural evidence
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: sapling-variation-family-001-evidence
          path: evidence/sapling-variation-family-001
          if-no-files-found: error
      - name: Upload exact migrated cross-source procedural evidence
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: tree-branch-crown-migrated-lineage-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/tree-branch-crown-migrated-lineage-001
          if-no-files-found: error
      - name: Upload exact procedural leaf-backface family evidence
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: tree-procedural-leaf-backface-family-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/tree-procedural-leaf-backface-family-001
          if-no-files-found: error
      - name: Upload exact procedural leaf-flutter family evidence
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: tree-procedural-leaf-flutter-family-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/tree-procedural-leaf-flutter-family-001
          if-no-files-found: error
      - name: Upload exact procedural Map receiver compatibility evidence
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: tree-procedural-leaf-flutter-map-receiver-family-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/tree-procedural-leaf-flutter-map-receiver-family-001
          if-no-files-found: error
