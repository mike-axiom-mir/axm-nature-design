name: UC Nature indexed bridge target receiver

on:
  push:
    branches: [studio/uc-nature-surface-bridge-001]
    paths:
      - "src/axm_nature_design/uc_indexed_bridge_receiver.py"
      - "tools/build_uc_indexed_bridge_target_evidence.py"
      - "contracts/nature-north-low-indexed-bridge-target-003.json"
      - "target-proof/observe_indexed_bridge_endpoint_region.gd"
      - ".github/workflows/uc-nature-indexed-bridge-target.yml"
  pull_request:
    paths:
      - "src/axm_nature_design/uc_indexed_bridge_receiver.py"
      - "tools/build_uc_indexed_bridge_target_evidence.py"
      - "contracts/nature-north-low-indexed-bridge-target-003.json"
      - "target-proof/observe_indexed_bridge_endpoint_region.gd"
      - ".github/workflows/uc-nature-indexed-bridge-target.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-indexed-bridge-current-uc-target:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact Technical Art head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact Technical Art head
        run: |
          set -euo pipefail
          OBSERVED="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$OBSERVED" = "$EXPECTED"
          printf '%s\n' "$OBSERVED" > /tmp/exact-technical-art-head.txt

      - name: Checkout exact Geometry donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: 8ab552710df21567cfd601af99181918e2cfadb3
          path: .geometry

      - name: Checkout exact Rigging owner
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: 5c0c06be96996bad464846071b2a55622be14620
          path: .rigging

      - name: Checkout exact current Universal Creation donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: f7434152295bc9a3d57c59767481b2ef042ec675
          path: .uc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile bounded Technical Art receiver
        run: |
          python -m compileall -q \
            src/axm_nature_design/uc_indexed_bridge_receiver.py \
            tools/build_uc_indexed_bridge_target_evidence.py

      - name: Re-run exact Rigging owner suite
        run: |
          set -euo pipefail
          cd .rigging
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Build exact indexed bridge through current UC
        run: |
          set -euo pipefail
          rm -rf evidence/nature-north-low-indexed-bridge-target-003
          mkdir -p evidence/nature-north-low-indexed-bridge-target-003
          PYTHONPATH=src:.uc/src \
            python tools/build_uc_indexed_bridge_target_evidence.py \
              --geometry-root .geometry \
              --rigging-root .rigging \
              --uc-root .uc \
              --out evidence/nature-north-low-indexed-bridge-target-003
          cp /tmp/exact-technical-art-head.txt evidence/nature-north-low-indexed-bridge-target-003/

      - name: Validate pre-target contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/nature-north-low-indexed-bridge-target-003')
          r=json.loads((root/'nature-north-low-indexed-bridge-uc-target-receipt.json').read_text())
          assert r['result']=='PASS_NATURE_NORTH_LOW_INDEXED_BRIDGE_CURRENT_UC_TARGET_RECEIVER_READY',r
          assert r['heads']=={
              'geometry':'8ab552710df21567cfd601af99181918e2cfadb3',
              'rigging':'5c0c06be96996bad464846071b2a55622be14620',
              'uc':'f7434152295bc9a3d57c59767481b2ef042ec675',
          },r
          q=r['receiver']
          assert q['source_vertex_count']==16 and q['source_triangle_count']==16,q
          assert q['moving_target_vertex_region']==[0,8],q
          assert q['fixed_target_vertex_region']==[8,16],q
          assert q['target_vertex_stride_bytes']==12,q
          assert q['target_moving_byte_offset']==0,q
          assert q['target_moving_byte_length']==96,q
          assert q['target_full_position_bytes']==192,q
          assert q['coordinate_handedness_determinant']==-1,q
          assert q['triangle_winding_reversed_exactly_once'] is True,q
          assert r['pose_count']==5,r
          assert r['owner']['continuous_minimum_span_m'] > 0.0105,r
          assert r['owner']['indexed_trunk_cut_or_connected_junction'] is False,r
          assert r['uc']['procedural_3d_blob']=='cdb654d4d0f68a4ca7539d98a985d7a70cf7ee36',r
          assert r['uc']['product_code_modified_by_technical_art'] is False,r
          assert r['uc']['nature_geometry_or_rigging_semantics_moved_to_uc'] is False,r
          assert r['truth_boundary']['real_target_host_endpoint_region_update_proven'] is False,r
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - name: Fail closed on region drift and authority inflation
        run: |
          set -euo pipefail
          if PYTHONPATH=src:.uc/src python tools/build_uc_indexed_bridge_target_evidence.py \
              --geometry-root .geometry --rigging-root .rigging --uc-root .uc --out /tmp/negative-region \
              --mutate-moving-vertex-end 9; then
            echo "mutated moving endpoint region unexpectedly passed" >&2
            exit 1
          fi
          if PYTHONPATH=src:.uc/src python tools/build_uc_indexed_bridge_target_evidence.py \
              --geometry-root .geometry --rigging-root .rigging --uc-root .uc --out /tmp/negative-topology \
              --claim-connected-topology; then
            echo "connected-topology authority inflation unexpectedly passed" >&2
            exit 1
          fi
          if PYTHONPATH=src:.uc/src python tools/build_uc_indexed_bridge_target_evidence.py \
              --geometry-root .geometry --rigging-root .rigging --uc-root .uc --out /tmp/negative-animation \
              --claim-animation-transfer; then
            echo "Animation authority inflation unexpectedly passed" >&2
            exit 1
          fi
          printf '%s\n' 'PASS_REJECTED_ENDPOINT_REGION_DRIFT_CONNECTED_TOPOLOGY_AND_ANIMATION_AUTHORITY_INFLATION' \
            > evidence/nature-north-low-indexed-bridge-target-003/negative-controls.txt

      - name: Download pinned Godot 4.7.2
        if: matrix.python-version == '3.11'
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        if: matrix.python-version == '3.11'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Exercise exact full and endpoint-region target updates
        if: matrix.python-version == '3.11'
        run: |
          set -euo pipefail
          rm -rf target-proof/generated
          mkdir -p target-proof/generated
          cp evidence/nature-north-low-indexed-bridge-target-003/nature-north-low-indexed-bridge-uc-target-receipt.json target-proof/generated/
          cp evidence/nature-north-low-indexed-bridge-target-003/nature-north-low-indexed-bridge-target-oracle.json target-proof/generated/
          cp evidence/nature-north-low-indexed-bridge-target-003/nature-north-low-indexed-bridge.glb target-proof/generated/
          rm -f target-proof/nature-north-low-indexed-bridge-godot-target-receipt.json
          xvfb-run --auto-servernum --server-args="-screen 0 1000x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path target-proof \
            --script observe_indexed_bridge_endpoint_region.gd
          cp target-proof/nature-north-low-indexed-bridge-godot-target-receipt.json \
            evidence/nature-north-low-indexed-bridge-target-003/
          cp target-proof/generated/*.png evidence/nature-north-low-indexed-bridge-target-003/

      - name: Validate exact real-Godot target result
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/nature-north-low-indexed-bridge-target-003')
          r=json.loads((root/'nature-north-low-indexed-bridge-godot-target-receipt.json').read_text())
          assert r['state']=='PASS_NATURE_NORTH_LOW_INDEXED_BRIDGE_CURRENT_UC_GODOT_ENDPOINT_REGION_TRANSPORT',r
          assert r['imported_vertices']==16 and r['imported_triangles']==16,r
          assert r['moving_vertex_region']==[0,8] and r['fixed_vertex_region']==[8,16],r
          assert r['moving_byte_offset']==0 and r['moving_byte_length']==96,r
          assert r['full_position_byte_length']==192,r
          assert r['minimum_target_host_paired_span_m'] > 0.009,r
          observation=r['imported_neutral_position_observation']
          assert observation['vertex_count']==16,r
          assert observation['maximum_distance_m'] <= r['import_observation_tolerance_m'] <= 1e-4,r
          assert len(r['driver_rows'])==5,r
          assert all(row['control_candidate_render_delta']['byte_identical'] for row in r['driver_rows']),r
          assert sum(row['candidate_vs_neutral_render_delta']['changed_pixels'] > 10 for row in r['driver_rows'] if abs(row['child_angle_deg']) > 0.001) == 4,r
          t=r['truth_boundary']
          assert t['target_endpoint_region_correspondence_proven_operationally_by_full_vs_partial_render_identity'] is True,r
          assert t['real_target_host_partial_endpoint_region_update_exercised'] is True,r
          assert t['five_representative_rigging_poses_exercised'] is True,r
          assert t['animation_timing_or_playback_proven'] is False,r
          assert t['indexed_cut_or_connected_topology_proven'] is False,r
          assert t['runtime_controller_device_or_performance_proven'] is False,r
          assert t['uc_inferred_nature_geometry_or_rigging_semantics'] is False,r
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - name: Retain exact source and owner provenance
        if: always()
        run: |
          set -euo pipefail
          root=evidence/nature-north-low-indexed-bridge-target-003
          mkdir -p "$root"
          cp contracts/nature-north-low-indexed-bridge-target-003.json "$root/" || true
          cp src/axm_nature_design/uc_indexed_bridge_receiver.py "$root/" || true
          cp tools/build_uc_indexed_bridge_target_evidence.py "$root/" || true
          cp target-proof/observe_indexed_bridge_endpoint_region.gd "$root/" || true
          cp .geometry/src/axm_nature_design/rear_tree_geometry_north_low_indexed_surface_rebind.py "$root/exact-geometry-module.py" || true
          cp .geometry/contracts/east-rear-north-low-indexed-surface-rebind-geometry-008.json "$root/exact-geometry-contract.json" || true
          cp .rigging/src/axm_nature_design/rear_tree_rigging_north_low_indexed_surface_rebind.py "$root/exact-rigging-module.py" || true
          cp .rigging/contracts/east-rear-north-low-indexed-surface-rebind-rigging-011.json "$root/exact-rigging-contract.json" || true
          cp .rigging/examples/east_rear_tree_neutral_001.json "$root/exact-source.json" || true
          git rev-parse HEAD > "$root/exact-technical-art-head.txt"
          git -C .geometry rev-parse HEAD > "$root/exact-geometry-head.txt"
          git -C .rigging rev-parse HEAD > "$root/exact-rigging-head.txt"
          git -C .uc rev-parse HEAD > "$root/exact-uc-head.txt"

      - name: Upload retained Nature indexed bridge target evidence
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: nature-north-low-indexed-bridge-target-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/nature-north-low-indexed-bridge-target-003
          if-no-files-found: warn
          retention-days: 30
