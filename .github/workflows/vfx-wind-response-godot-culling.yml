name: Nature VFX migrated wind Godot culling evidence

on:
  push:
    branches: [studio/vfx-sapling-wind-response-migrated-001]
    paths:
      - "src/axm_nature_design/wind_response.py"
      - "src/axm_nature_design/wind_response_migrated.py"
      - "examples/sapling_wind_response_migrated_001.json"
      - "tools/build_sapling_wind_response_migrated.py"
      - "target-proof-vfx/**"
      - ".github/workflows/vfx-wind-response-godot-culling.yml"
  pull_request:
    paths:
      - "src/axm_nature_design/wind_response.py"
      - "src/axm_nature_design/wind_response_migrated.py"
      - "examples/sapling_wind_response_migrated_001.json"
      - "tools/build_sapling_wind_response_migrated.py"
      - "target-proof-vfx/**"
      - ".github/workflows/vfx-wind-response-godot-culling.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-migrated-wind-godot-culling:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact VFX PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact VFX head
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          OBSERVED="$(git rev-parse HEAD)"
          test "$OBSERVED" = "$EXPECTED"
          printf '%s\n' "$OBSERVED" > exact-head.txt
          git merge-base --is-ancestor 4ddbe66e5c02d22407ef773d5346a2fe6f349a2d HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild exact migrated VFX samples
        run: |
          set -euo pipefail
          python -m compileall -q src tools tests
          python -m unittest discover -s tests -v
          rm -rf evidence/sapling-wind-response-migrated-001
          python tools/build_sapling_wind_response_migrated.py evidence/sapling-wind-response-migrated-001
          cp exact-head.txt evidence/sapling-wind-response-migrated-001/exact-head.txt
          rm -rf target-proof-vfx/generated
          mkdir -p target-proof-vfx/generated
          cp evidence/sapling-wind-response-migrated-001/summary.json target-proof-vfx/generated/
          cp evidence/sapling-wind-response-migrated-001/evidence.json target-proof-vfx/generated/
          cp evidence/sapling-wind-response-migrated-001/frame_*ms_mesh.json target-proof-vfx/generated/
          cp exact-head.txt target-proof-vfx/generated/

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Observe exact migrated VFX woody deformation under target-host culling
        run: |
          set -euo pipefail
          rm -f target-proof-vfx/vfx-migrated-wind-godot-culling-receipt.json target-proof-vfx/wind-*.png
          xvfb-run --auto-servernum --server-args="-screen 0 1000x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path target-proof-vfx \
            --script observe_migrated_wind_response.gd \
            2>&1 | tee evidence/sapling-wind-response-migrated-001/godot-target-host.log
          cp target-proof-vfx/vfx-migrated-wind-godot-culling-receipt.json evidence/sapling-wind-response-migrated-001/
          cp target-proof-vfx/wind-*.png evidence/sapling-wind-response-migrated-001/

      - name: Validate bounded target-host VFX culling result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('evidence/sapling-wind-response-migrated-001')
          r = json.loads((root/'vfx-migrated-wind-godot-culling-receipt.json').read_text())
          head = (root/'exact-head.txt').read_text().strip()
          assert r['state'] == 'PASS_MIGRATED_WOODY_WIND_RESPONSE_GODOT_CULLING_STABILITY', r
          assert r['vfx_head'] == head, (r['vfx_head'], head)
          assert r['migrated_neutral_mesh_digest'] == '47dd4d82651138299d05071df3e8a410f21f673ab8d42b936d7222eb5351b862', r
          assert r['sample_ids'] == ['0000','0125','0250','0375','0500'], r
          assert set(r['contexts']) == {'ground_oblique','high_oblique'}, r
          assert r['woody_triangle_count'] > 0, r
          assert r['excluded_leaf_triangle_count'] > 0, r
          assert len(r['culling_comparisons']) == 10, r
          assert all(v['changed_pixels'] == 0 for v in r['culling_comparisons'].values()), r
          assert all(v['changed_pixels'] == 0 for v in r['neutral_return'].values()), r
          assert all(v['changed_pixels'] > 0 for v in r['neutral_to_peak_visual_delta'].values()), r
          truth = r['truth_boundary']
          assert truth['leaf_geometry_included'] is False, truth
          assert truth['target_host_backface_culling_tested'] is True, truth
          assert truth['continuous_playback_or_timing_tested'] is False, truth
          assert truth['shaded_lookdev_tested'] is False, truth
          assert truth['map_receiving_scene_tested'] is False, truth
          assert truth['physical_wind_or_biomechanics'] is False, truth
          assert truth['gameplay_or_collision'] is False, truth
          assert truth['target_device_performance'] is False, truth
          print(json.dumps({
              'state': r['state'],
              'woody_triangles': r['woody_triangle_count'],
              'excluded_leaf_triangles': r['excluded_leaf_triangle_count'],
              'neutral_to_peak_visual_delta': r['neutral_to_peak_visual_delta'],
          }, indent=2))
          PY

      - name: Retain exact migrated-wind target-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapling-wind-response-migrated-godot-culling-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/sapling-wind-response-migrated-001
          if-no-files-found: warn
          retention-days: 30
