name: Animation east rear root socket diagnostic pulse

on:
  pull_request:
    paths:
      - "examples/east_rear_tree_neutral_001.json"
      - "src/axm_nature_design/organic_form.py"
      - "src/axm_nature_design/rear_tree_rigging.py"
      - "src/axm_nature_design/rear_tree_animation.py"
      - "contracts/east-rear-root-socket-rigging-001.json"
      - "contracts/east-rear-root-socket-animation-001.json"
      - "tools/verify_rear_tree_animation.py"
      - "tests/test_rear_tree_animation.py"
      - "docs/ANIMATION_EAST_REAR_ROOT_SOCKET_001.md"
      - ".github/workflows/animation-east-rear-root-socket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pin exact Rigging parent and owner bytes
        shell: bash
        run: |
          set -euo pipefail
          RIGGING_HEAD=87ce8b2ff10937abec4432e1c6d5a7114a076cdb
          git merge-base --is-ancestor "$RIGGING_HEAD" HEAD
          git diff --exit-code "$RIGGING_HEAD" HEAD -- \
            examples/east_rear_tree_neutral_001.json \
            src/axm_nature_design/organic_form.py \
            src/axm_nature_design/rear_tree_rigging.py \
            contracts/east-rear-root-socket-rigging-001.json

      - name: Compile
        run: python -m compileall -q src tools tests

      - name: Full repository unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build exact Animation evidence
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/exact-head.txt
          printf '%s\n' 87ce8b2ff10937abec4432e1c6d5a7114a076cdb > evidence/exact-rigging-parent.txt
          python tools/verify_rear_tree_animation.py \
            --output evidence/east-rear-root-socket-animation-evidence-001.json \
            --svg-output evidence/east-rear-root-socket-animation-review-001.svg
          cp contracts/east-rear-root-socket-animation-001.json evidence/
          cp docs/ANIMATION_EAST_REAR_ROOT_SOCKET_001.md evidence/
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          payload = json.loads(Path('evidence/east-rear-root-socket-animation-evidence-001.json').read_text())
          assert payload['result'] == 'PASS_NORTH_TOP_ROOT_SOCKET_DIAGNOSTIC_PULSE_SAMPLED_MOTION'
          assert all(payload['checks'].values())
          assert payload['motion']['truth_label'] == 'ANIMATION_DIAGNOSTIC_SOCKET_PULSE_NOT_WIND_NOT_BIOLOGICAL_ROM_NOT_CONTROLLER'
          assert payload['motion']['landmarks'] == [
              {'time_s': 0.0, 'angle_deg': 0.0},
              {'time_s': 0.25, 'angle_deg': 5.0},
              {'time_s': 0.5, 'angle_deg': 0.0},
              {'time_s': 0.75, 'angle_deg': -5.0},
              {'time_s': 1.0, 'angle_deg': 0.0},
          ]
          assert payload['measurements']['wrap_step_residual_m'] <= 1e-12
          assert payload['measurements']['maximum_rigging_witness_metric_residual'] <= 1e-12
          truth = payload['truth_boundary']
          assert truth['target_engine_playback_claimed'] is False
          assert truth['runtime_controller_or_state_machine_claimed'] is False
          assert truth['gameplay_or_input_acceptance_claimed'] is False
          ET.parse('evidence/east-rear-root-socket-animation-review-001.svg')
          PY

      - name: Upload retained Animation evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: nature-east-rear-root-socket-animation-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
