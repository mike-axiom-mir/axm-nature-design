name: Geometry source topology migration evidence
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Test full receiving repository
        run: python -m unittest discover -s tests -v
      - name: Build exact source-topology migration evidence
        if: matrix.python == '3.11'
        run: |
          python tools/build_source_topology_migration_evidence.py evidence/source-topology-migration-001
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('evidence/source-topology-migration-001/summary.json').read_text())
          assert summary['state'] == 'PASS_SOURCE_GENERATOR_MIGRATION_3_REAL_OUTPUTS', summary
          assert summary['source_count'] == 3, summary
          assert summary['geometry_oracle_ref'] == 'e2224d4bf88f7e68503072c884e5a726b8d0c53d', summary
          for item in summary['items']:
              assert item['migrated_mesh_digest'] == item['proven_reindex_digest'], item
              assert item['migrated_mesh_digest'] != item['historical_mesh_digest'], item
              assert item['topology']['shared_edge_orientation_conflicts'] == 0, item
              assert item['truth_boundary']['predecessor_pass_transferred'] is False, item
          rear = next(item for item in summary['items'] if item['study_id'] == 'east-rear-tree-neutral-001')
          assert rear['source_ref'] == 'fdc9d2b6ee729728551e22fd3eafa23ad60b6c7a', rear
          assert rear['source_digest'] == '178cd8cfb1a859bff411f60e13154109528062cf0ad2384b343d406cc0cc9d61', rear
          assert rear['predecessor_source_ref'] == 'a4e5ee011e1d87f47866a7e6c6f4e66f57b6af12', rear
          assert rear['predecessor_source_digest'] == '0adf2cde8cfc355ec21b6fb06c6759b753300164b5f72ba029dc1b8c6d2ef307', rear
          PY
      - name: Record exact workflow head
        if: matrix.python == '3.11'
        run: git rev-parse HEAD > evidence/source-topology-migration-001/exact-head.txt
      - name: Upload exact source-topology migration evidence
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: source-topology-migration-001-evidence
          path: evidence/source-topology-migration-001
          if-no-files-found: error
