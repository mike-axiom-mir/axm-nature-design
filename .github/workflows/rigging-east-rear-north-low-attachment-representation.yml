name: Rigging east rear north-low attachment representation

on:
  pull_request:
    paths:
      - "examples/east_rear_tree_neutral_001.json"
      - "src/axm_nature_design/rear_tree_rigging_north_low_parent_influence_gate.py"
      - "src/axm_nature_design/rear_tree_rigging_north_low_attachment_representation_gate.py"
      - "contracts/east-rear-north-low-attachment-representation-rigging-008.json"
      - "tools/verify_rear_tree_rigging_north_low_attachment_representation_gate.py"
      - "tests/test_rear_tree_rigging_north_low_attachment_representation_gate.py"
      - "docs/RIGGING_EAST_REAR_NORTH_LOW_ATTACHMENT_REPRESENTATION_GATE_008.md"
      - ".github/workflows/rigging-east-rear-north-low-attachment-representation.yml"
  push:
    branches:
      - "studio/rigging-east-rear-root-socket-001"
    paths:
      - "examples/east_rear_tree_neutral_001.json"
      - "src/axm_nature_design/rear_tree_rigging_north_low_parent_influence_gate.py"
      - "src/axm_nature_design/rear_tree_rigging_north_low_attachment_representation_gate.py"
      - "contracts/east-rear-north-low-attachment-representation-rigging-008.json"
      - "tools/verify_rear_tree_rigging_north_low_attachment_representation_gate.py"
      - "tests/test_rear_tree_rigging_north_low_attachment_representation_gate.py"
      - "docs/RIGGING_EAST_REAR_NORTH_LOW_ATTACHMENT_REPRESENTATION_GATE_008.md"
      - ".github/workflows/rigging-east-rear-north-low-attachment-representation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pin exact Rigging predecessor and Geometry donor
        shell: bash
        run: |
          set -euo pipefail
          RIG=975931b11555d156e04e2ab12e9756fc6c9598a3
          GEO=d32a41558910d78595042fb638a785714f825806
          git merge-base --is-ancestor "$RIG" HEAD
          if ! git cat-file -e "$GEO^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$GEO"
          fi
          git merge-base --is-ancestor "$RIG" "$GEO"
          test "$(git rev-parse "$GEO:contracts/east-rear-north-low-attachment-topology-geometry-005.json")" = "127502ae50c7b442c88edd8454c9a74ba053da71"
          test "$(git rev-parse "$GEO:src/axm_nature_design/rear_tree_geometry_north_low_attachment_topology.py")" = "279bd95a80208f346bd654e300e4b02aff34cf47"
          test "$(git rev-parse HEAD:examples/east_rear_tree_neutral_001.json)" = "fb12b759e1abfd0455bf46fd39a0eba27095796b"

      - name: Compile
        run: python -m compileall -q src tools tests

      - name: Test full receiving repository
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build exact attachment-representation evidence
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          GEO=d32a41558910d78595042fb638a785714f825806
          OUT=evidence/north-low-attachment-representation-008
          mkdir -p "$OUT"
          git show "$GEO:contracts/east-rear-north-low-attachment-topology-geometry-005.json" > "$OUT/geometry-donor-contract.json"
          python tools/verify_rear_tree_rigging_north_low_attachment_representation_gate.py \
            --geometry-contract "$OUT/geometry-donor-contract.json" \
            --output "$OUT/evidence.json" \
            | tee "$OUT/verifier.log"
          cp contracts/east-rear-north-low-attachment-representation-rigging-008.json "$OUT/contract.json"
          cp docs/RIGGING_EAST_REAR_NORTH_LOW_ATTACHMENT_REPRESENTATION_GATE_008.md "$OUT/README.md"
          cp src/axm_nature_design/rear_tree_rigging_north_low_attachment_representation_gate.py "$OUT/receiver.py"
          cp tools/verify_rear_tree_rigging_north_low_attachment_representation_gate.py "$OUT/verifier.py"
          git rev-parse HEAD > "$OUT/exact-head.txt"
          printf '%s\n' "$GEO" > "$OUT/geometry-donor-head.txt"
          printf '%s\n' 975931b11555d156e04e2ab12e9756fc6c9598a3 > "$OUT/rigging-predecessor-head.txt"

      - name: Assert bounded truth boundary
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('evidence/north-low-attachment-representation-008/evidence.json').read_text())
          assert report['result'] == 'PASS_NORTH_LOW_DETACHED_CHILD_SOCKET_ATTACHMENT_REPRESENTATION_GATE_DIAGNOSTIC', report
          topology = report['geometry_attachment_class']
          assert topology['edge_connected_components'] == 6, topology
          assert topology['shared_indexed_vertices_with_trunk'] == 0, topology
          constraint = report['attachment_representation_constraint']
          assert constraint['mode'] == 'DETACHED_DIAGNOSTIC_CHILD_SOCKET_ONLY', constraint
          assert constraint['production_connected_skinning_allowed'] is False, constraint
          motion = report['preserved_rigging_motion_evidence']
          assert motion['representative_parent_child_pose_count'] == 9, motion
          assert motion['maximum_gated_parent_command_leak_m'] <= 1e-9, motion
          assert motion['connected_surface_continuity_proven'] is False, motion
          assert report['all_failure_controls_rejected'] is True, report
          truth = report['truth_boundary']
          assert truth['animation_timing_interpolation_or_playback_claimed'] is False, truth
          assert truth['technical_art_target_host_claimed'] is False, truth
          assert truth['runtime_controller_or_device_claimed'] is False, truth
          PY

      - name: Upload exact Rigging evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: nature-north-low-attachment-representation-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/north-low-attachment-representation-008
          if-no-files-found: error
