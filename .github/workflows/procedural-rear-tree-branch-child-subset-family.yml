name: Procedural Nature branch child subset family
on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout exact procedural head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout exact Organic owner head
        if: matrix.python == '3.11'
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: fdc9d2b6ee729728551e22fd3eafa23ad60b6c7a
          path: .studio-deps/organic-east-rear-current

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile
        run: python -m compileall -q src tools tests

      - name: Test full receiving repository
        run: python -m unittest discover -s tests -v

      - name: Build exact branch subset family evidence
        if: matrix.python == '3.11'
        run: >-
          python tools/build_rear_tree_branch_child_subset_family_evidence.py
          evidence/nature-rear-tree-branch-child-subset-family-001
          --organic-root .studio-deps/organic-east-rear-current

      - name: Verify bounded subset-family truth gate
        if: matrix.python == '3.11'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path("evidence/nature-rear-tree-branch-child-subset-family-001/summary.json").read_text()
          )
          assert data["state"] == "PASS_NATURE_BRANCH_CHILD_SUBSET_COMPOSITION_FAMILY"
          assert data["decision"] == "PASS_DERIVED_PARTITION_SUBSETS_ONLY__NO_SOURCE_KINEMATIC_MOTION_VFX_RUNTIME_OR_DOWNSTREAM_ADOPTION"
          assert data["procedural_head"] == os.environ["EXPECTED_HEAD"]
          assert data["organic_provider_head"] == "fdc9d2b6ee729728551e22fd3eafa23ad60b6c7a"
          assert data["partition_family_digest"] == "ab688f5281dc4e79770e133b49e7af3a533092acc1e0a0945bfa86e647e7b122"
          assert data["subset_family_digest"] == data["reverse_order_subset_family_digest"]
          assert data["output_count"] == 5
          assert data["distinct_selection_digest_count"] == 5
          assert data["distinct_vertex_index_digest_count"] == 5
          rows = {row["subset_id"]: row for row in data["outputs"]}
          assert rows["single-south-low"]["vertex_count"] == 52
          assert rows["low-opposed-pair"]["vertex_count"] == 104
          assert rows["mid-upper-trio"]["vertex_count"] == 156
          assert rows["four-without-top"]["vertex_count"] == 208
          assert rows["all-five"]["vertex_count"] == 260
          assert [rows[key]["triangle_count"] for key in (
              "single-south-low", "low-opposed-pair", "mid-upper-trio", "four-without-top", "all-five"
          )] == [72, 144, 216, 288, 360]
          assert [rows[key]["fixed_vertex_count"] for key in (
              "single-south-low", "low-opposed-pair", "mid-upper-trio", "four-without-top", "all-five"
          )] == [338, 286, 234, 182, 130]
          assert all(row["source_authorized"] is False for row in data["outputs"])
          assert all(row["rigging_authorized"] is False for row in data["outputs"])
          assert all(row["animation_authorized"] is False for row in data["outputs"])
          assert all(row["vfx_authorized"] is False for row in data["outputs"])
          assert all(row["runtime_authorized"] is False for row in data["outputs"])
          assert data["all_failure_controls_rejected"] is True
          assert len(data["failure_controls"]) == 12
          print("PASS_NATURE_BRANCH_CHILD_SUBSET_FAMILY_TRUTH_GATE")
          PY

      - name: Upload exact retained subset-family evidence
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: nature-rear-tree-branch-child-subset-family-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/nature-rear-tree-branch-child-subset-family-001
          if-no-files-found: error
