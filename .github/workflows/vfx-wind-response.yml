name: Nature VFX wind response
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Test all receiving-repo regressions
        run: python -m unittest discover -s tests -v
      - name: Build exact retained VFX evidence
        if: matrix.python == '3.11'
        run: python tools/build_sapling_wind_response.py evidence/sapling-wind-response-001
      - name: Upload exact retained VFX evidence
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: sapling-wind-response-001-evidence
          path: evidence/sapling-wind-response-001
          if-no-files-found: error
