name: Nature VFX migrated wind response evidence

on:
  push:
    branches: [studio/vfx-sapling-wind-response-migrated-001]
    paths:
      - "src/axm_nature_design/wind_response.py"
      - "src/axm_nature_design/wind_response_migrated.py"
      - "examples/sapling_wind_response_migrated_001.json"
      - "tests/test_wind_response_migrated.py"
      - "tools/build_sapling_wind_response_migrated.py"
      - "docs/SAPLING_WIND_RESPONSE_MIGRATED_001.md"
      - ".github/workflows/vfx-wind-response-migrated.yml"
  pull_request:
    paths:
      - "src/axm_nature_design/wind_response.py"
      - "src/axm_nature_design/wind_response_migrated.py"
      - "examples/sapling_wind_response_migrated_001.json"
      - "tests/test_wind_response_migrated.py"
      - "tools/build_sapling_wind_response_migrated.py"
      - "docs/SAPLING_WIND_RESPONSE_MIGRATED_001.md"
      - ".github/workflows/vfx-wind-response-migrated.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MIGRATION_PARENT: 4ddbe66e5c02d22407ef773d5346a2fe6f349a2d

jobs:
  exact-migrated-vfx-rebind:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact migrated source lineage
        run: |
          set -euo pipefail
          git rev-parse HEAD > exact-head.txt
          git cat-file -e "$MIGRATION_PARENT^{commit}"
          git merge-base --is-ancestor "$MIGRATION_PARENT" HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile receiving repository
        run: python -m compileall -q src tools tests
      - name: Run full receiving repository regression suite
        run: python -m unittest discover -s tests -v
      - name: Build exact migrated VFX evidence
        if: matrix.python == '3.11'
        run: |
          out=evidence/sapling-wind-response-migrated-001
          python tools/build_sapling_wind_response_migrated.py "$out"
          cp exact-head.txt "$out/exact-head.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('evidence/sapling-wind-response-migrated-001')
          summary = json.loads((root/'summary.json').read_text())
          evidence = json.loads((root/'evidence.json').read_text())
          assert summary['state'] == 'PASS_MIGRATED_TOPOLOGY_VISUAL_WIND_RESPONSE_REBIND', summary
          assert summary['underlying_response_state'] == 'PASS_BOUNDED_VISUAL_WIND_RESPONSE', summary
          assert summary['migrated_neutral_mesh_digest'] == '47dd4d82651138299d05071df3e8a410f21f673ab8d42b936d7222eb5351b862', summary
          assert abs(summary['peak_max_displacement_m'] - 0.18) <= 1e-12, summary
          assert summary['peak_crosswind_residual_m'] <= 1e-12, summary
          assert summary['max_anchor_displacement_m'] <= 1e-12, summary
          assert summary['response_profile_changed'] is False, summary
          assert summary['source_json_changed'] is False, summary
          assert evidence['migration_rebind']['geometry_oracle_ref'] == 'e2224d4bf88f7e68503072c884e5a726b8d0c53d', evidence
          assert len(evidence['samples']) == 5, evidence
          PY
      - name: Exercise explicit migration-provenance negative control
        if: matrix.python == '3.11'
        run: |
          python - <<'PY'
          import copy, sys
          from pathlib import Path
          root = Path('.').resolve()
          sys.path.insert(0, str(root/'src'))
          from axm_nature_design.organic_form import load_source
          from axm_nature_design.wind_response_migrated import load_spec, validate_spec
          source = load_source(root/'examples'/'sapling_neutral_001.json')
          spec = load_spec(root/'examples'/'sapling_wind_response_migrated_001.json')
          bad = copy.deepcopy(spec)
          bad['generator_migration']['head'] = 'drifted'
          try:
              validate_spec(bad, source)
          except ValueError as exc:
              assert 'generator migration provenance mismatch' in str(exc), exc
          else:
              raise AssertionError('migration provenance drift must fail closed')
          PY
      - name: Upload exact migrated VFX evidence
        if: always() && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: sapling-wind-response-migrated-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/sapling-wind-response-migrated-001
          if-no-files-found: warn
          retention-days: 30
