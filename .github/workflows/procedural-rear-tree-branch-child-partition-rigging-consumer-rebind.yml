name: Procedural Nature branch partition current Rigging consumer rebind
on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout exact procedural head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout exact current Rigging consumer head
        if: matrix.python == '3.11'
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: 754797a815266a643c6b08f1606eb76ba95dd8c6
          path: .studio-deps/rigging-current

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile
        run: python -m compileall -q src tools tests

      - name: Test full receiving repository
        run: python -m unittest discover -s tests -v

      - name: Re-run exact current Rigging family evidence
        if: matrix.python == '3.11'
        run: |
          mkdir -p .studio-deps/rigging-evidence
          (
            cd .studio-deps/rigging-current
            PYTHONPATH=src python tools/verify_rear_tree_primary_branch_rigging_family.py \
              --output "$GITHUB_WORKSPACE/.studio-deps/rigging-evidence/family.json"
            PYTHONPATH=src python tools/verify_rear_tree_rigging_shared_driver_polarity.py \
              --output "$GITHUB_WORKSPACE/.studio-deps/rigging-evidence/shared-driver.json"
          )

      - name: Build exact current-Rigging consumer rebind evidence
        if: matrix.python == '3.11'
        run: >-
          python tools/build_rear_tree_branch_child_partition_rigging_consumer_rebind_evidence.py
          evidence/nature-rear-tree-branch-child-partition-rigging-consumer-rebind-003
          --rigging-root .studio-deps/rigging-current
          --rigging-family-evidence .studio-deps/rigging-evidence/family.json
          --shared-driver-evidence .studio-deps/rigging-evidence/shared-driver.json

      - name: Verify bounded consumer-rebind truth gate
        if: matrix.python == '3.11'
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          data = json.loads(
              Path("evidence/nature-rear-tree-branch-child-partition-rigging-consumer-rebind-003/summary.json").read_text()
          )
          event_head = os.environ.get("PR_HEAD") or subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert data["state"] == "PASS_NATURE_BRANCH_PARTITION_CURRENT_RIGGING_CONSUMER_REBIND"
          assert data["decision"] == "PASS_EXACT_CURRENT_RIGGING_CONSUMER_REBIND__FIVE_SELECTION_IDENTITIES_MATCH__NO_RIGGING_MOTION_OR_DOWNSTREAM_ADOPTION"
          assert data["procedural_head"] == event_head
          assert data["rigging_consumer_head"] == "754797a815266a643c6b08f1606eb76ba95dd8c6"
          assert data["procedural_family_digest"] == "ab688f5281dc4e79770e133b49e7af3a533092acc1e0a0945bfa86e647e7b122"
          assert data["reverse_order_family_digest"] == data["procedural_family_digest"]
          assert data["branch_count"] == 5
          assert data["distinct_partition_digest_count"] == 5
          assert data["distinct_vertex_index_digest_count"] == 5
          assert data["all_exact_selection_identities_match"] is True
          assert data["pairwise_vertex_disjoint"] is True
          assert data["rigging_shared_driver_observed_not_adopted"] is True
          assert all(row["selection_match"] for row in data["comparisons"])
          assert all(row["vertex_count"] == 52 for row in data["comparisons"])
          assert all(row["triangle_count"] == 72 for row in data["comparisons"])
          assert all(row["fixed_vertex_count"] == 338 for row in data["comparisons"])
          signs = {row["branch_id"]: row["command_sign_multiplier"] for row in data["comparisons"]}
          assert signs == {
              "south-low": 1.0,
              "north-low": -1.0,
              "east-mid": 1.0,
              "west-high": -1.0,
              "north-top": 1.0,
          }
          assert data["all_failure_controls_rejected"] is True
          assert len(data["failure_controls"]) == 10
          assert all(value is False for key, value in data["truth_boundary"].items() if key != "source_authorized")
          assert data["truth_boundary"]["source_authorized"] is False
          print("PASS_NATURE_BRANCH_PARTITION_CURRENT_RIGGING_CONSUMER_REBIND_TRUTH_GATE")
          PY
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload exact retained current-Rigging consumer rebind evidence
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: nature-rear-tree-branch-child-partition-rigging-consumer-rebind-003-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/nature-rear-tree-branch-child-partition-rigging-consumer-rebind-003
          if-no-files-found: error
