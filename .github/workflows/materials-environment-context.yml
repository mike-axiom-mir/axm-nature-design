name: Materials environment-context evidence

on:
  push:
    branches: [studio/materials-sapling-lookdev-001]
    paths:
      - "lookdev-environment-proof/**"
      - "tools/build_material_environment_context.py"
      - "tests/test_material_environment_context.py"
      - ".github/workflows/materials-environment-context.yml"
      - "lookdev/sapling_material_profile_001.json"
      - "src/axm_nature_design/materials_lookdev.py"
      - "src/axm_nature_design/uc_surface_bridge.py"
      - "src/axm_nature_design/organic_form.py"
      - "examples/sapling_neutral_001.json"
  pull_request:
    paths:
      - "lookdev-environment-proof/**"
      - "tools/build_material_environment_context.py"
      - "tests/test_material_environment_context.py"
      - ".github/workflows/materials-environment-context.yml"
      - "lookdev/sapling_material_profile_001.json"
      - "src/axm_nature_design/materials_lookdev.py"
      - "src/axm_nature_design/uc_surface_bridge.py"
      - "src/axm_nature_design/organic_form.py"
      - "examples/sapling_neutral_001.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-static-environment-material-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Nature Materials lane
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout exact Environment receiving context
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-map-design
          ref: d52cb54a2aeb3eb4f5668e3d6ba4b05ddcc02899
          path: .map

      - name: Checkout exact Nature source used by Environment
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-nature-design
          ref: fbc202449981f2bac153951c561ed0ed6120c936
          path: .nature-source

      - name: Checkout exact Weather source used by Environment
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-weather-design
          ref: ca2eaba519e8449835b0ea6ef944b7080c3caa6a
          path: .weather

      - name: Compile and test bounded context adapter
        run: |
          python -m compileall -q src tests tools
          PYTHONPATH=src python -m unittest tests.test_material_environment_context tests.test_materials_lookdev tests.test_uc_surface_bridge -v

      - name: Build exact static environment material A/B packet
        env:
          AXM_MATERIALS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          PYTHONPATH=src python tools/build_material_environment_context.py \
            --map-root .map \
            --nature-source-root .nature-source \
            --weather-root .weather \
            --output evidence/sapling-material-environment-context-001

      - name: Validate exact context and source-preserving comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/sapling-material-environment-context-001')
          e=json.loads((root/'evidence.json').read_text())
          c=json.loads((root/'context.json').read_text())
          assert e['status']=='PASS_CONTEXT_READY_FOR_TARGET_RENDER',e
          assert all(e['checks'].values()),e
          assert c['environment']['scene_digest']=='f63ddbb0fcdacd5109b45df1d0338701fb138014d3b98dc697d6279fd370447d',c['environment']
          assert c['comparison_contract']['movement']=='NONE_STATIC_NEUTRAL_ONLY',c['comparison_contract']
          assert c['comparison_contract']['environment_placement_changes']=='NONE',c['comparison_contract']
          assert c['material_evidence']['checks']['geometry_unchanged'] is True,c['material_evidence']
          assert c['material_evidence']['checks']['materials_changed'] is True,c['material_evidence']
          for variant in ('baseline','candidate'):
              surface=c['portable_surface'][variant]
              assert len(surface['primitives'])==2,variant
              assert sum(len(p['indices'])//3 for p in surface['primitives'])==620,variant
          print(json.dumps(e,indent=2))
          PY

      - name: Stage exact context into proof host
        run: |
          rm -rf lookdev-environment-proof/generated
          mkdir -p lookdev-environment-proof/generated
          cp evidence/sapling-material-environment-context-001/context.json lookdev-environment-proof/generated/

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Render baseline and candidate in both exact Environment cameras
        run: |
          set -euo pipefail
          rm -f lookdev-environment-proof/material-environment-context-runtime-receipt.json \
            lookdev-environment-proof/baseline-path_eye.png \
            lookdev-environment-proof/candidate-path_eye.png \
            lookdev-environment-proof/baseline-elevated_oblique.png \
            lookdev-environment-proof/candidate-elevated_oblique.png
          xvfb-run --auto-servernum --server-args="-screen 0 1200x800x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path lookdev-environment-proof \
            --script observe.gd

      - name: Validate target-host A/B evidence and pixel non-identity
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('lookdev-environment-proof')
          r=json.loads((root/'material-environment-context-runtime-receipt.json').read_text())
          assert r['state']=='PASS_TARGET_HOST_STATIC_ENVIRONMENT_MATERIAL_AB_READY',r
          assert r['promotion_effect']=='NONE',r
          assert r['environment_scene_digest']=='f63ddbb0fcdacd5109b45df1d0338701fb138014d3b98dc697d6279fd370447d',r
          assert set(r['contexts'])=={'path_eye','elevated_oblique'},r
          for context,row in r['contexts'].items():
              for variant in ('baseline','candidate'):
                  assert row[variant]['state']=='PASS',(context,variant,row[variant])
                  assert row[variant]['capture']['bytes']>3000,(context,variant,row[variant])
                  assert row[variant]['sapling']['triangles']==620,(context,variant,row[variant])
                  assert row[variant]['weather']['streaks']==36,(context,variant,row[variant])
              before=(root/f'baseline-{context}.png').read_bytes()
              after=(root/f'candidate-{context}.png').read_bytes()
              assert hashlib.sha256(before).hexdigest()!=hashlib.sha256(after).hexdigest(),context
          print(json.dumps(r,indent=2))
          PY

      - name: Upload exact environment-context material evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapling-material-environment-context-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lookdev/sapling_material_profile_001.json
            evidence/sapling-material-environment-context-001/context.json
            evidence/sapling-material-environment-context-001/evidence.json
            lookdev-environment-proof/material-environment-context-runtime-receipt.json
            lookdev-environment-proof/baseline-path_eye.png
            lookdev-environment-proof/candidate-path_eye.png
            lookdev-environment-proof/baseline-elevated_oblique.png
            lookdev-environment-proof/candidate-elevated_oblique.png
          if-no-files-found: warn
          retention-days: 30
